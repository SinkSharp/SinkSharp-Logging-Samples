auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: index_
        period: 24h

# Required for OTLP log ingestion in Loki 3.x
limits_config:
  allow_structured_metadata:            true
  max_structured_metadata_entries_count: 128
  max_structured_metadata_size:         64KB
  volume_enabled:                       true
  reject_old_samples:                   false
  # Index these resource-level OTLP attributes as Loki stream labels
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - deployment.environment

# Required: tell Loki which resource attributes become stream labels
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - deployment.environment
