# OTel Collector — receives OTLP on 4317 (gRPC) and 4318 (HTTP)
# Routes: traces → Jaeger, logs → Loki

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 256

exporters:
  debug:
    verbosity: normal

  # Traces → Jaeger via OTLP gRPC
  otlp/jaeger:
    endpoint: jaeger-full:4317
    tls:
      insecure: true

  # Logs → Loki via OTLP HTTP endpoint
  # otlphttp exporter appends /v1/logs → http://loki:3100/otlp/v1/logs
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [otlp/jaeger, debug]
    logs:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [otlphttp/loki, debug]
