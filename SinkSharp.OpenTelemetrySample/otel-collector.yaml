# OTel Collector v0.164+ — uses new exporter names (otlp_grpc, otlp_http)
# Receives OTLP on 4317 (gRPC) and 4318 (HTTP)
# Routes: traces → Jaeger, logs → Loki

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 256

exporters:
  debug:
    verbosity: detailed

  # Traces → Jaeger (otlp_grpc replaces deprecated otlp)
  otlp_grpc/jaeger:
    endpoint: jaeger-full:4317
    tls:
      insecure: true

  # Logs → Loki OTLP HTTP endpoint (otlp_http replaces deprecated otlphttp)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [otlp_grpc/jaeger, debug]
    logs:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [otlp_http/loki, debug]
